name: Wheels and release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Wheels / ${{ matrix.os }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x86_64
    steps:
      - uses: actions/checkout@v7
      - name: Install macOS OpenMP runtime
        if: runner.os == 'macOS'
        run: brew install libomp
      - name: Check tag matches distribution version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python3 - <<'PYTHON'
          import os, tomllib
          with open('pyproject.toml', 'rb') as f:
              version = tomllib.load(f)['project']['version']
          assert os.environ['GITHUB_REF_NAME'] == 'v' + version
          PYTHON
      - uses: pypa/cibuildwheel@v4.2.0
        env:
          CIBW_ARCHS: ${{ matrix.arch }}
          CIBW_CONFIG_SETTINGS: "cmake.define.GIAO_ENABLE_OPENMP=ON"
          # Match Homebrew runtime's supported baseline, not a falsely old tag.
          MACOSX_DEPLOYMENT_TARGET: "15.0"
      - uses: actions/upload-artifact@v6
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.arch }}
          path: wheelhouse/*.whl

  sdist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install build
      - run: python -m build --sdist
      - name: Verify source archive builds with isolated pip
        run: |
          python -m venv /tmp/sdist-check
          /tmp/sdist-check/bin/python -m pip install dist/*.tar.gz
          /tmp/sdist-check/bin/python tests/wheel_smoke.py
      - uses: actions/upload-artifact@v6
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    # Explicit per-tag maintainer approval is required even for a tag push.
    if: startsWith(github.ref, 'refs/tags/v') && vars.PYPI_APPROVED_TAG == github.ref_name
    needs: [build, sdist]
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/giao-integrals
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v7
        with:
          name: sdist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
