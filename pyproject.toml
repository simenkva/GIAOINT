[build-system]
requires = [
    "scikit-build-core>=0.10",
    "pybind11>=2.13",
]
build-backend = "scikit_build_core.build"

[project]
name = "giao-integrals"
version = "0.9.0"
description = "Cartesian integrals for complex GIAO/London Gaussians"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]
keywords = ["quantum-chemistry", "GIAO", "London-orbitals", "integrals"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Chemistry",
]

[project.optional-dependencies]
molecule = ["basis-set-exchange>=0.11"]

[project.urls]
Documentation = "https://github.com/simenkva/GIAOINT/tree/main/docs"
Issues = "https://github.com/simenkva/GIAOINT/issues"
Repository = "https://github.com/simenkva/GIAOINT"

[tool.scikit-build]
cmake.build-type = "Release"
wheel.packages = ["python/giao_integrals"]
sdist.include = [
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "LICENSE",
    "examples/**",
]

[tool.scikit-build.cmake.define]
GIAO_ENABLE_OPENMP = "AUTO"
GIAO_BUILD_TESTS = "OFF"
GIAO_BUILD_BENCHMARKS = "OFF"

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests/reference", "tests/python"]
pythonpath = ["reference/python", "python"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.cibuildwheel]
build = "cp311-* cp312-* cp313-* cp314-*"
skip = "*-musllinux_* *-win*"
test-command = "python {project}/tests/wheel_smoke.py"
environment = { GIAO_REQUIRE_BUNDLED_OMP = "1" }

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
repair-wheel-command = "auditwheel repair -w {dest_dir} {wheel}"

[tool.cibuildwheel.macos]
repair-wheel-command = "delocate-wheel --require-archs {delocate_archs} -w {dest_dir} -v {wheel}"
