[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests/reference"]
pythonpath = ["reference/python"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

